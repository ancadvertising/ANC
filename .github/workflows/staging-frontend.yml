name: Deploy staging frontend

on:
  push:
    branches: [staging]
    paths:
      - "frontend/**"
      - "scripts/build-staging-frontend.mjs"
      - "scripts/assert-staging-config.mjs"
      - ".github/workflows/staging-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anc-erp-staging-frontend
  cancel-in-progress: true

jobs:
  build:
    name: Build staging SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/assert-staging-config.mjs
      - run: node scripts/build-staging-frontend.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/staging-frontend

  deploy:
    name: Deploy GitHub Pages staging site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v4
