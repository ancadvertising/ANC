name: Deploy staging backend

on:
  push:
    branches: [staging]
    paths:
      - "worker/**"
      - "scripts/assert-staging-config.mjs"
      - ".github/workflows/staging-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anc-erp-staging-backend
  cancel-in-progress: true

jobs:
  verify:
    name: Test staging backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: node scripts/assert-staging-config.mjs
      - run: npm test
        working-directory: worker
      - run: npm run check:staging
        working-directory: worker

  deploy:
    name: Deploy isolated staging Worker
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker-staging
      url: https://anc-marketing-erp-api-staging.anc-advertising.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Recheck staging isolation
        run: node scripts/assert-staging-config.mjs
      - name: Initialize staging schema when database is empty
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          schema_result="$(npx wrangler d1 execute anc-erp-staging --env staging --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='users';")"
          if ! grep -q '"users"' <<< "$schema_result"; then
            npx wrangler d1 execute anc-erp-staging --env staging --remote --file schema/staging-baseline.sql
          fi
          npx wrangler d1 migrations apply anc-erp-staging --env staging --remote
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env staging
